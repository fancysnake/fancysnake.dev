[tools]
node = "26.7.0"
aube = "1.38.0"

[tasks.install]
description = "Install dependencies"
run = "aube install"

[tasks.ci]
description = "Clean install from the frozen lockfile"
run = "aube ci"

[tasks.dev]
description = "Run the dev server on http://localhost:4321"
run = "aube run dev"

[tasks.build]
description = "Build the static site into dist/"
run = "aube run build"

[tasks.preview]
description = "Serve the built site from dist/"
run = "aube run preview"

[tasks.check]
description = "Typecheck the Astro project"
run = "aube run check"
